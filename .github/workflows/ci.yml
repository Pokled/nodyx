name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule le run précédent sur la même branche si un nouveau push arrive
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Le job CI ne fait que lire les sources et exécuter les tests. Aucun besoin
# d'écrire au repo ou de toucher aux secrets autres que le GITHUB_TOKEN par
# défaut. Permission minimale pour réduire la surface en cas d'injection
# (scénario Megalodon : payload base64 dans yaml qui exfiltre le GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  # ── 1. nodyx-core — TypeScript + Vitest ────────────────────────────────────
  test-node:
    name: "nodyx-core — typecheck + tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: nodyx-core/package-lock.json

      - name: Install dependencies
        working-directory: nodyx-core
        run: npm ci

      - name: TypeScript — typecheck
        working-directory: nodyx-core
        run: npx tsc --noEmit

      - name: Vitest — suite complète
        working-directory: nodyx-core
        # Valeur factice, requise par le bootstrap backend qui refuse de
        # démarrer sans JWT_SECRET >= 32 chars. La prod utilise son propre
        # secret dans son .env, jamais dans le repo. Cette chaîne n'a
        # aucun privilège : container CI éphémère, aucune DB derrière,
        # aucun JWT forgé avec ça ne sera valide ailleurs que dans le
        # runner GitHub jetable.
        env:
          JWT_SECRET: CI_PLACEHOLDER_NOT_A_REAL_SECRET_safe_to_be_public
          NODE_ENV: test
        run: npm test

  # ── 2. nodyx-frontend — Svelte typecheck + build ───────────────────────────
  check-frontend:
    name: "nodyx-frontend — typecheck + build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: nodyx-frontend/package-lock.json

      - name: Install dependencies
        working-directory: nodyx-frontend
        run: npm ci

      - name: i18n — clés référencées présentes (pas de clé affichée en brut)
        working-directory: nodyx-frontend
        run: npm run i18n:keys:check

      - name: i18n — l'anglais reste à parité avec la source
        working-directory: nodyx-frontend
        run: npm run i18n:parity:check

      - name: i18n — placeholders intacts dans chaque traduction
        working-directory: nodyx-frontend
        run: npm run i18n:placeholders:check

      - name: i18n — aucune chaîne FR en dur (public + admin)
        working-directory: nodyx-frontend
        run: npm run i18n:check

      - name: Vitest — tests frontend
        working-directory: nodyx-frontend
        run: npm test

      - name: Svelte — typecheck (svelte-check)
        working-directory: nodyx-frontend
        env:
          PUBLIC_API_URL: http://localhost:3000/api/v1
          PUBLIC_DIRECTORY_URL: https://nodyx.org
          PUBLIC_SIGNET_URL: ''
          PUBLIC_TURN_URL: ''
          PUBLIC_TURN_USERNAME: ''
          PUBLIC_TURN_CREDENTIAL: ''
          PUBLIC_GIPHY_KEY: ''
          PUBLIC_TENOR_KEY: ''
          PRIVATE_API_SSR_URL: 'http://localhost:3000'
        run: npm run check

      - name: SvelteKit — build production
        working-directory: nodyx-frontend
        env:
          PUBLIC_API_URL: http://localhost:3000/api/v1
          PUBLIC_DIRECTORY_URL: https://nodyx.org
          PUBLIC_SIGNET_URL: ''
          PUBLIC_TURN_URL: ''
          PUBLIC_TURN_USERNAME: ''
          PUBLIC_TURN_CREDENTIAL: ''
          PUBLIC_GIPHY_KEY: ''
          PUBLIC_TENOR_KEY: ''
          PRIVATE_API_SSR_URL: 'http://localhost:3000'
        run: npm run build

  # ── 3. nodyx-p2p — Rust build + tests ─────────────────────────────────────
  test-rust:
    name: "nodyx-p2p — cargo build + tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Rust toolchain (stable, depuis rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-XX

      - name: Cache Rust (registry + target)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: nodyx-p2p

      # Build + test TOUT le workspace (pas seulement nodyx-server) : un build
      # limité à un crate laissait passer en silence des crates cassés — c'est
      # exactement comme ça qu'un bump hmac 0.13 a cassé nexus-turn sans alerte.
      - name: cargo build --workspace
        working-directory: nodyx-p2p
        run: cargo build --workspace

      - name: cargo test --workspace
        working-directory: nodyx-p2p
        run: cargo test --workspace

  # ── 4. Applications satellites — typecheck + build ────────────────────────
  # nodyx.dev (docs), start.nodyx.org (landing), le hub et l'authenticator sont
  # DÉPLOYÉS mais n'avaient aucune CI : un build cassé pouvait partir en prod
  # sans que rien ne l'arrête. Constaté le 2026-08-07, quand des modifications
  # de landing et docs sont passées sans qu'aucun job ne les construise.
  check-satellites:
    name: "${{ matrix.app }} — typecheck + build"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # un satellite cassé ne doit pas masquer l'état des autres
      matrix:
        app: [nodyx-docs, nodyx-hub, nodyx-landing, nodyx-authenticator, nodyx-store]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Svelte — typecheck (svelte-check)
        working-directory: ${{ matrix.app }}
        run: npm run check

      - name: Vitest — tests (si l'app en a)
        if: hashFiles(format('{0}/vitest.config.ts', matrix.app)) != ''
        working-directory: ${{ matrix.app }}
        run: npm test

      - name: Vite — build production
        working-directory: ${{ matrix.app }}
        run: npm run build

  # ── 5. Hygiène du dépôt ───────────────────────────────────────────────────
  # Une règle `.gitignore` n'a AUCUN effet sur un fichier déjà suivi. Deux
  # images uploadées par un utilisateur sont ainsi restées publiques dans le
  # dépôt d'avril à août 2026, alors que le .gitignore disait déjà « données
  # personnelles, ne jamais publier ». Ce job transforme l'intention en règle.
  repo-hygiene:
    name: "hygiène du dépôt — aucun contenu privé suivi"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Aucun fichier uploadé par un utilisateur n'est suivi
        run: |
          # Seuls les .gitkeep (arborescence) et le widget de démonstration
          # livré avec le produit ont le droit d'être suivis sous uploads/.
          LEAKED=$(git ls-files 'nodyx-core/uploads/*' \
            | grep -vE '\.gitkeep$|^nodyx-core/uploads/widgets/video-player/' || true)
          if [ -n "$LEAKED" ]; then
            echo "Du contenu utilisateur est suivi par git :"
            echo "$LEAKED" | sed 's/^/  /'
            echo ""
            echo "Ces fichiers seraient publiés avec le dépôt. Retire-les du suivi :"
            echo "  git rm --cached <fichier>   (le fichier reste sur le disque)"
            exit 1
          fi
          echo "Aucun contenu utilisateur suivi."

      - name: Aucun secret ni clé privée suivis
        run: |
          LEAKED=$(git ls-files \
            | grep -iE '(^|/)\.env($|\.)|\.(pem|key|p12|pfx)$' \
            | grep -v '\.env\.example' || true)
          if [ -n "$LEAKED" ]; then
            echo "Des fichiers sensibles sont suivis par git :"
            echo "$LEAKED" | sed 's/^/  /'
            exit 1
          fi
          echo "Aucun secret suivi."

      - name: Le dossier .claude n'est jamais suivi
        run: |
          # Il contient des notes privées et des données personnelles : sa
          # présence dans le dépôt serait une fuite, pas une maladresse.
          LEAKED=$(git ls-files | grep '^\.claude/' || true)
          if [ -n "$LEAKED" ]; then
            echo "Le dossier .claude est suivi par git. Fuite de données privées :"
            echo "$LEAKED" | sed 's/^/  /'
            exit 1
          fi
          echo ".claude n'est pas suivi."
