name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule le run précédent sur la même branche si un nouveau push arrive
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Le job CI ne fait que lire les sources et exécuter les tests. Aucun besoin
# d'écrire au repo ou de toucher aux secrets autres que le GITHUB_TOKEN par
# défaut. Permission minimale pour réduire la surface en cas d'injection
# (scénario Megalodon : payload base64 dans yaml qui exfiltre le GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  # ── 1. nodyx-core — TypeScript + Vitest ────────────────────────────────────
  test-node:
    name: "nodyx-core — typecheck + tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: nodyx-core/package-lock.json

      - name: Install dependencies
        working-directory: nodyx-core
        run: npm ci

      - name: TypeScript — typecheck
        working-directory: nodyx-core
        run: npx tsc --noEmit

      - name: Vitest — suite complète
        working-directory: nodyx-core
        # Valeur factice, requise par le bootstrap backend qui refuse de
        # démarrer sans JWT_SECRET >= 32 chars. La prod utilise son propre
        # secret dans son .env, jamais dans le repo. Cette chaîne n'a
        # aucun privilège : container CI éphémère, aucune DB derrière,
        # aucun JWT forgé avec ça ne sera valide ailleurs que dans le
        # runner GitHub jetable.
        env:
          JWT_SECRET: CI_PLACEHOLDER_NOT_A_REAL_SECRET_safe_to_be_public
          NODE_ENV: test
        run: npm test

  # ── 2. nodyx-frontend — Svelte typecheck + build ───────────────────────────
  check-frontend:
    name: "nodyx-frontend — typecheck + build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: nodyx-frontend/package-lock.json

      - name: Install dependencies
        working-directory: nodyx-frontend
        run: npm ci

      - name: i18n — clés référencées présentes (pas de clé affichée en brut)
        working-directory: nodyx-frontend
        run: npm run i18n:keys:check

      - name: i18n — l'anglais reste à parité avec la source
        working-directory: nodyx-frontend
        run: npm run i18n:parity:check

      - name: i18n — placeholders intacts dans chaque traduction
        working-directory: nodyx-frontend
        run: npm run i18n:placeholders:check

      - name: i18n — aucune chaîne FR en dur (public + admin)
        working-directory: nodyx-frontend
        run: npm run i18n:check

      # Les .ts échappaient entièrement au scanner jusqu'au 2026-08-20, ce qui
      # cachait ~375 chaînes. Les résorber prend du temps, alors cette porte est
      # un CLIQUET : la dette gelée dans dette-ts.json est tolérée, toute
      # nouvelle chaîne fait tomber la construction. Elle peut baisser, jamais
      # monter.
      - name: i18n — pas de NOUVELLE chaîne FR en dur dans les .ts
        working-directory: nodyx-frontend
        run: npm run i18n:ts:check

      - name: Vitest — tests frontend
        working-directory: nodyx-frontend
        run: npm test

      - name: Svelte — typecheck (svelte-check)
        working-directory: nodyx-frontend
        env:
          PUBLIC_API_URL: http://localhost:3000/api/v1
          PUBLIC_DIRECTORY_URL: https://nodyx.org
          PUBLIC_SIGNET_URL: ''
          PUBLIC_TURN_URL: ''
          PUBLIC_TURN_USERNAME: ''
          PUBLIC_TURN_CREDENTIAL: ''
          PUBLIC_GIPHY_KEY: ''
          PUBLIC_TENOR_KEY: ''
          PRIVATE_API_SSR_URL: 'http://localhost:3000'
        run: npm run check

      - name: SvelteKit — build production
        working-directory: nodyx-frontend
        env:
          PUBLIC_API_URL: http://localhost:3000/api/v1
          PUBLIC_DIRECTORY_URL: https://nodyx.org
          PUBLIC_SIGNET_URL: ''
          PUBLIC_TURN_URL: ''
          PUBLIC_TURN_USERNAME: ''
          PUBLIC_TURN_CREDENTIAL: ''
          PUBLIC_GIPHY_KEY: ''
          PUBLIC_TENOR_KEY: ''
          PRIVATE_API_SSR_URL: 'http://localhost:3000'
        run: npm run build

  # ── 3. nodyx-p2p — Rust build + tests ─────────────────────────────────────
  test-rust:
    name: "nodyx-p2p — cargo build + tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (stable, depuis rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-XX

      - name: Cache Rust (registry + target)
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: nodyx-p2p

      # Build + test TOUT le workspace (pas seulement nodyx-server) : un build
      # limité à un crate laissait passer en silence des crates cassés — c'est
      # exactement comme ça qu'un bump hmac 0.13 a cassé nexus-turn sans alerte.
      - name: cargo build --workspace
        working-directory: nodyx-p2p
        run: cargo build --workspace

      - name: cargo test --workspace
        working-directory: nodyx-p2p
        run: cargo test --workspace

  # ── 4. Applications satellites — typecheck + build ────────────────────────
  # nodyx.dev (docs), start.nodyx.org (landing), le hub et l'authenticator sont
  # DÉPLOYÉS mais n'avaient aucune CI : un build cassé pouvait partir en prod
  # sans que rien ne l'arrête. Constaté le 2026-08-07, quand des modifications
  # de landing et docs sont passées sans qu'aucun job ne les construise.
  check-satellites:
    name: "${{ matrix.app }} — typecheck + build"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # un satellite cassé ne doit pas masquer l'état des autres
      matrix:
        app: [nodyx-docs, nodyx-hub, nodyx-landing, nodyx-authenticator, nodyx-store]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Svelte — typecheck (svelte-check)
        working-directory: ${{ matrix.app }}
        run: npm run check

      - name: Vitest — tests (si l'app en a)
        if: hashFiles(format('{0}/vitest.config.ts', matrix.app)) != ''
        working-directory: ${{ matrix.app }}
        run: npm test

      - name: Vite — build production
        working-directory: ${{ matrix.app }}
        run: npm run build

  # ── 5. Hygiène du dépôt ───────────────────────────────────────────────────
  # Une règle `.gitignore` n'a AUCUN effet sur un fichier déjà suivi. Deux
  # images uploadées par un utilisateur sont ainsi restées publiques dans le
  # dépôt d'avril à août 2026, alors que le .gitignore disait déjà « données
  # personnelles, ne jamais publier ». Ce job transforme l'intention en règle.
  repo-hygiene:
    name: "hygiène du dépôt — aucun contenu privé suivi"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Aucun fichier uploadé par un utilisateur n'est suivi
        run: |
          # Seuls les .gitkeep (arborescence) et le widget de démonstration
          # livré avec le produit ont le droit d'être suivis sous uploads/.
          LEAKED=$(git ls-files 'nodyx-core/uploads/*' \
            | grep -vE '\.gitkeep$|^nodyx-core/uploads/widgets/video-player/' || true)
          if [ -n "$LEAKED" ]; then
            echo "Du contenu utilisateur est suivi par git :"
            echo "$LEAKED" | sed 's/^/  /'
            echo ""
            echo "Ces fichiers seraient publiés avec le dépôt. Retire-les du suivi :"
            echo "  git rm --cached <fichier>   (le fichier reste sur le disque)"
            exit 1
          fi
          echo "Aucun contenu utilisateur suivi."

      - name: Aucun secret ni clé privée suivis
        run: |
          LEAKED=$(git ls-files \
            | grep -iE '(^|/)\.env($|\.)|\.(pem|key|p12|pfx)$' \
            | grep -v '\.env\.example' || true)
          if [ -n "$LEAKED" ]; then
            echo "Des fichiers sensibles sont suivis par git :"
            echo "$LEAKED" | sed 's/^/  /'
            exit 1
          fi
          echo "Aucun secret suivi."

      - name: Le dossier .claude n'est jamais suivi
        run: |
          # Il contient des notes privées et des données personnelles : sa
          # présence dans le dépôt serait une fuite, pas une maladresse.
          LEAKED=$(git ls-files | grep '^\.claude/' || true)
          if [ -n "$LEAKED" ]; then
            echo "Le dossier .claude est suivi par git. Fuite de données privées :"
            echo "$LEAKED" | sed 's/^/  /'
            exit 1
          fi
          echo ".claude n'est pas suivi."

  # uninstall.sh détruit des données : il a son banc d'essai (faux système de
  # fichiers, doublures pour systemctl/ufw/psql/redis…, PATH hermétique). Sans
  # ce job, il était resté 7 mois sans relecture pendant qu'install.sh évoluait.
  scripts-shell:
    name: "scripts — shellcheck + bancs des installeurs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck (avertissements bloquants)
        run: shellcheck -S warning uninstall.sh scripts/tests/uninstall.test.sh scripts/install/caddyfile.sh scripts/tests/caddyfile.test.sh scripts/tests/firewall-ssh.test.sh scripts/tests/install-prompts.test.sh scripts/tests/install-data.test.sh scripts/tests/install-slug.test.sh scripts/tests/tunnel-caddyfile.test.sh scripts/tests/tunnel-hardening.test.sh scripts/tests/install-binaries.test.sh scripts/tests/install-services.test.sh scripts/install/build.sh scripts/tests/install-update.test.sh scripts/tests/install-noninteractive.test.sh

      - name: Banc de uninstall.sh
        run: bash scripts/tests/uninstall.test.sh

      # Pare-feu des deux installeurs : ne jamais enfermer l'administrateur dehors
      # (vrai port SSH, règle vérifiée AVANT activation, règles existantes gardées).
      - name: Banc du pare-feu des installeurs
        run: bash scripts/tests/firewall-ssh.test.sh

      # Confirmations d'install.sh : « non » veut dire non, Entrée n'arrête jamais
      # un serveur web existant, un Caddyfile partagé n'est pas écrasé en silence.
      - name: Banc des confirmations d'install.sh
        run: bash scripts/tests/install-prompts.test.sh

      # Données : valeurs du .env relues à l'identique par le vrai dotenv, mot de
      # passe admin jamais en argument, JSON exacts, PostgreSQL existant jamais
      # supprimé, aucune dépendance à sudo.
      - name: Banc « l'installeur ne casse ni ne perd de données »
        run: bash scripts/tests/install-data.test.sh

      # Le nom <slug>.nodyx.org est vérifié AVANT toute modification ; plus aucun
      # changement de nom après la compilation du frontend.
      - name: Banc du nom d'instance (annuaire)
        run: bash scripts/tests/install-slug.test.sh

      # install_tunnel.sh : core en boucle locale, Node 22, confirmations, mot de
      # passe admin, domaine, sauvegarde avant effacement, cloudflared signé.
      - name: Banc du durcissement d'install_tunnel.sh
        run: bash scripts/tests/tunnel-hardening.test.sh

      # Binaires exécutés en root par install.sh : empreinte SHA-256 épinglée et
      # vérifiée avant installation ; à chaque CI, les empreintes épinglées sont
      # comparées à celles que GitHub publie (une publication remplacée échoue ici).
      # Services relais et TURN : secrets hors de la ligne de commande, migration
      # des unités existantes sans perdre le serveur du relais.
      - name: Banc des services relais / TURN
        run: bash scripts/tests/install-services.test.sh

      # Mise à jour : compilée à côté, bascule seulement si core ET frontend sont
      # compilés ; une compilation ratée laisse le site intact ; sauvegarde de la
      # base avant ; plus de fuser -k ; nodyx-update délègue à l'installeur.
      - name: Banc de la mise à jour
        run: bash scripts/tests/install-update.test.sh

      # Sans terminal (cron, Ansible, nodyx-update par ssh) : plus de mort sur
      # </dev/tty, --yes prend les défauts, une question sans réponse arrête
      # proprement. Mot de passe et jeton par fichier ou variable, jeton du
      # tunnel Cloudflare hors de la ligne de commande de cloudflared.
      - name: Banc du mode non interactif et des secrets
        run: bash scripts/tests/install-noninteractive.test.sh

      - name: Banc des binaires (empreintes, contre GitHub)
        env:
          NODYX_TEST_GITHUB: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/tests/install-binaries.test.sh

      # Le banc du Caddyfile fait tourner un VRAI Caddy : binaire officiel, empreinte
      # SHA-512 vérifiée contre le fichier de sommes publié avec la version.
      - name: Caddy (binaire officiel, empreinte vérifiée)
        run: |
          V=2.11.1
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/caddyserver/caddy/releases/download/v${V}/caddy_${V}_checksums.txt"
          curl -fsSLO "https://github.com/caddyserver/caddy/releases/download/v${V}/caddy_${V}_linux_amd64.tar.gz"
          grep " caddy_${V}_linux_amd64.tar.gz$" "caddy_${V}_checksums.txt" | sha512sum -c -
          tar -xzf "caddy_${V}_linux_amd64.tar.gz" caddy
          sudo install -m 755 caddy /usr/local/bin/caddy
          caddy version

      # Caddyfile d'install.sh : l'IP du visiteur parvient au core, aucun en-tête
      # forgé ne passe (domaine direct et relais), migration des installations
      # existantes, modèles d'install.sh.
      - name: Banc du Caddyfile d'install.sh
        run: bash scripts/tests/caddyfile.test.sh

      # Caddyfile d'install_tunnel.sh, trois modes, vrai Caddy : X-Forwarded-For lu
      # par la droite, CF-Connecting-IP jamais transmis, confiance réduite par mode.
      - name: Banc du Caddyfile d'install_tunnel.sh
        run: bash scripts/tests/tunnel-caddyfile.test.sh
