<!doctype html>
<!-- Le marqueur juste après lang="%lang%" ci-dessous est substitué côté
     serveur par hooks.server.ts depuis le cookie nodyx_theme (attribut
     data-theme="light"/"dark", ou rien pour laisser prefers-color-scheme
     trancher) — évite un flash du mauvais thème avant hydratation. Cf.
     $lib/theme.ts. Ecrit ici sans les signes % qui l'entourent pour ne pas
     etre lui-meme substitue par erreur (piege deja rencontre le 23/09: le
     premier remplacement gagnait celui-ci, pas celui du tag html). -->
<html lang="%lang%"%theme-attr%>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<!-- PWA -->
		<meta name="theme-color" content="#0a0a0f" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Nodyx" />
		<link rel="manifest" href="/manifest.json" />

		<!-- Favicons (multi-format, multi-size) -->
		<link rel="icon"          type="image/x-icon" href="/favicon.ico" />
		<link rel="icon"          type="image/png"   sizes="16x16"   href="/icons/icon-16.png" />
		<link rel="icon"          type="image/png"   sizes="32x32"   href="/icons/icon-32.png" />
		<link rel="icon"          type="image/png"   sizes="48x48"   href="/icons/icon-48.png" />
		<link rel="icon"          type="image/png"   sizes="192x192" href="/icons/icon-192.png" />
		<link rel="icon"          type="image/png"   sizes="512x512" href="/icons/icon-512.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

		<!-- og:image / twitter:image / twitter:card sont gérés dynamiquement par
		     +layout.svelte (défaut absolu) et surchargés par page (article, profil,
		     événement...). Rien de statique ici pour éviter les doublons. -->

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
